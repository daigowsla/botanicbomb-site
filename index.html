<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d25f5a">
  <meta name="description" content="BOTANICBOMBのゲーム入口ページです。">
  <meta property="og:title" content="BOTANICBOMB">
  <meta property="og:description" content="ボタボムバッジゲームをプレイできます。">
  <meta property="og:image" content="image.png">
  <meta property="og:type" content="website">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>BOTANICBOMB</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #231b18;
      --paper: #fff6e8;
      --accent: #d25f5a;
      --leaf: #2d6f2a;
      --gold: #f7c84b;
      --line: rgba(35, 27, 24, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        linear-gradient(rgba(255, 246, 232, 0.88), rgba(255, 246, 232, 0.88)),
        radial-gradient(circle at 18% 14%, rgba(45, 111, 42, 0.20), transparent 24%),
        radial-gradient(circle at 86% 82%, rgba(247, 200, 75, 0.24), transparent 28%),
        #f4dfc4;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      letter-spacing: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }

    main {
      width: min(100%, 430px);
      display: grid;
      gap: 18px;
      align-items: center;
      text-align: center;
    }

    .logo {
      width: min(100%, 320px);
      margin: 0 auto;
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(35, 27, 24, 0.16);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 11vw, 56px);
      line-height: 0.92;
      font-weight: 950;
    }

    p {
      margin: 0 auto;
      max-width: 28em;
      color: rgba(35, 27, 24, 0.72);
      font-size: 15px;
      line-height: 1.75;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    a {
      color: inherit;
    }

    .button {
      display: grid;
      place-items: center;
      min-height: 52px;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 12px 24px rgba(210, 95, 90, 0.28);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding-top: 8px;
    }

    .icon-link {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      color: var(--ink);
      text-decoration: none;
      transition: background 160ms ease, transform 160ms ease;
    }

    a.icon-link:hover {
      background: white;
      transform: translateY(-2px);
    }

    .icon-link:focus-visible {
      outline: 3px solid var(--leaf);
      outline-offset: 4px;
    }

    .icon-link svg {
      width: 25px;
      height: 25px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    footer {
      font-size: 11px;
      color: rgba(35, 27, 24, 0.48);
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="image.png" alt="BOTANICBOMB">
    <h1>BOTANICBOMB</h1>
    <div class="actions">
      <nav class="social-links" aria-label="ゲーム・SNS・ショップ">
        <!-- URLが決まったらspanをaに変更し、hrefを設定してください。 -->
        <span class="icon-link" role="link" aria-disabled="true" aria-label="Instagram（準備中）" title="Instagram（準備中）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="icon-link" role="link" aria-disabled="true" aria-label="YouTube（準備中）" title="YouTube（準備中）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3Z" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="icon-link" role="link" aria-disabled="true" aria-label="オンラインショップ（準備中）" title="オンラインショップ（準備中）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h3l2.5 12h11l2-8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
        </span>
        <a class="icon-link" href="https://game.botanicbomb.jp/" aria-label="ボタボムバッジゲームへ" title="ボタボムバッジゲーム">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 7h9c2 0 3 1.5 3.5 3.5l1 5c.5 2.5-1.8 3.8-3.5 2L15 15H9l-2.5 2.5c-1.7 1.8-4 .5-3.5-2l1-5C4.5 8.5 5.5 7 7.5 7Z"/><path d="M7 10v4m-2-2h4"/><circle cx="16" cy="10.5" r=".75" fill="currentColor" stroke="none"/><circle cx="18" cy="13" r=".75" fill="currentColor" stroke="none"/></svg>
        </a>
      </nav>
    </div>
    <footer>© BOTANICBOMB</footer>
  </main>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7853232717549544"
     crossorigin="anonymous"></script>
</body>
</html>
